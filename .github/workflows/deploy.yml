name: Manual Application Deployment
 
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. v1, latest)'
        required: true
        default: 'latest'
 
permissions:
  id-token: write   # Required for requesting the OIDC JWT token
  contents: read    # Required to checkout repository code
 
env:
  AWS_REGION: us-east-1 # Matches your Terraform default AWS region
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Locate EC2 Instance via Tag
        id: instance
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=serp-hawk-deploy-server" \
                       "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
          if [ -z "$ID" ] || [ "$ID" == "None" ]; then
            echo "Error: No running instance found with tag Name=serp-hawk-deploy-server" >&2
            exit 1
          fi
          echo "Found EC2 Instance ID: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
 
      # -----------------------------------------------------------------
      # Build the .env content HERE, in the GitHub Actions runner, from
      # GitHub Secrets. It never touches disk on the runner as a file —
      # it's base64-encoded and passed as a parameter to SSM send-command,
      # then decoded and written to a file only on the target EC2.
      # This keeps the values out of the SSM command's own event history
      # in plaintext and out of any GitHub Actions log output.
      # -----------------------------------------------------------------
      - name: Prepare encoded .env payload
        id: envfile
        run: |
          ENV_CONTENT=$(cat <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD=${{ secrets.SENDER_PASSWORD }}
          EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF
          )
          ENCODED=$(echo "$ENV_CONTENT" | base64 -w 0)
          echo "::add-mask::$ENCODED"
          echo "encoded=$ENCODED" >> "$GITHUB_OUTPUT"
 
      - name: Execute Deployment via AWS SSM
        env:
          ENV_B64: ${{ steps.envfile.outputs.encoded }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Manual Deploy tag ${{ github.event.inputs.image_tag }}" \
            --parameters commands="[
              \"set -e\",
              \"mkdir -p /home/ec2-user/app\",
              \"echo '${ENV_B64}' | base64 -d > /home/ec2-user/app/.env\",
              \"chmod 600 /home/ec2-user/app/.env\",
              \"if [ ! -s /home/ec2-user/app/.env ]; then echo 'ERROR: .env is empty after decode. Aborting.' >&2; exit 1; fi\",
              \"echo 'Env keys present (values hidden):'\",
              \"cut -d= -f1 /home/ec2-user/app/.env\",
 
              \"REGION=${{ env.AWS_REGION }}\",
              \"ACCOUNT_ID=\$(aws sts get-caller-identity --query Account --output text)\",
              \"REGISTRY=\${ACCOUNT_ID}.dkr.ecr.\${REGION}.amazonaws.com\",
              \"aws ecr get-login-password --region \$REGION | docker login --username AWS --password-stdin \$REGISTRY\",
              \"docker pull \$REGISTRY/serp-hawk-crm-v2-b:${{ github.event.inputs.image_tag }}\",
              \"docker pull \$REGISTRY/serp-hawk-crm-v2:${{ github.event.inputs.image_tag }}\",
              \"docker network create serp-hawk-net || true\",
              \"docker stop serp-hawk-backend serp-hawk-frontend || true\",
              \"docker rm serp-hawk-backend serp-hawk-frontend || true\",
              \"docker run -d --name serp-hawk-backend --network serp-hawk-net --restart unless-stopped -p 8000:8000 --env-file /home/ec2-user/app/.env \$REGISTRY/serp-hawk-crm-v2-b:${{ github.event.inputs.image_tag }}\",
              \"docker run -d --name serp-hawk-frontend --network serp-hawk-net --restart unless-stopped -p 3000:3000 \$REGISTRY/serp-hawk-crm-v2:${{ github.event.inputs.image_tag }}\",
              \"docker image prune -f\",
 
              \"sleep 8\",
              \"echo 'Backend container status:'\",
              \"docker ps --filter name=serp-hawk-backend\",
              \"echo 'Backend logs (last 30 lines):'\",
              \"docker logs serp-hawk-backend --tail 30\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "Deployment command sent successfully (Command ID: $COMMAND_ID). Waiting for execution..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.id }}"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.instance.outputs.id }}"
 
