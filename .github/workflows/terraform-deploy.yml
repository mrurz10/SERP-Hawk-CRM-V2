name: Terraform - Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------
  # Runs once: shared setup both environments depend on -
  # the state bucket/lock table, and the SonarQube DB password
  # written to SSM before either environment's apply runs.
  # ---------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      state_bucket: ${{ steps.bucket.outputs.name }}
      lock_table: ${{ steps.bucket.outputs.lock_table }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure SonarQube DB password exists in SSM
        run: |
          aws ssm put-parameter \
            --name "/sonarqube/db_password" \
            --value "${{ secrets.SONAR_DB_PASSWORD }}" \
            --type "SecureString" \
            --overwrite

      - name: Resolve AWS account ID
        id: account
        run: |
          echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Ensure Terraform state bucket + lock table exist
        id: bucket
        env:
          TF_STATE_BUCKET: serp-hawk-tfstate-${{ steps.account.outputs.id }}
          TF_LOCK_TABLE: serp-hawk-tfstate-lock
        run: |
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Creating state bucket: $TF_STATE_BUCKET"
            aws s3api create-bucket \
              --bucket "$TF_STATE_BUCKET" \
              --region ${{ env.AWS_REGION }} \
              $( [ "${{ env.AWS_REGION }}" != "us-east-1" ] && echo "--create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}" )

            aws s3api put-bucket-versioning \
              --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled

            aws s3api put-bucket-encryption \
              --bucket "$TF_STATE_BUCKET" \
              --server-side-encryption-configuration '{
                "Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]
              }'

            aws s3api put-public-access-block \
              --bucket "$TF_STATE_BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          else
            echo "State bucket already exists: $TF_STATE_BUCKET"
          fi

          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" >/dev/null 2>&1; then
            echo "Creating lock table: $TF_LOCK_TABLE"
            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST

            aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE"
          else
            echo "Lock table already exists: $TF_LOCK_TABLE"
          fi

          echo "name=$TF_STATE_BUCKET" >> "$GITHUB_OUTPUT"
          echo "lock_table=$TF_LOCK_TABLE" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------
  # Runs twice in parallel - once per environment folder,
  # each with its own state file, so applying one never
  # touches or risks the other.
  # ---------------------------------------------------------
  terraform:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [prod, sonarqube]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.prepare.outputs.state_bucket }}" \
            -backend-config="key=serp-hawk/${{ matrix.environment }}.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ needs.prepare.outputs.lock_table }}" \
            -backend-config="encrypt=true"

      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Show Outputs
        if: github.event.inputs.action == 'apply'
        run: terraform output