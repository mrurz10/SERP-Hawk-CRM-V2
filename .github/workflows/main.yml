name: Build and Push to ECR

on:
  push:
    branches: 
    - test
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: serphawk-backend    # change per repo, or add a matrix for frontend+backend

# Required so the OIDC token can be requested from GitHub for AWS auth
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Short-lived credentials issued to this exact repo/workflow only -
      # no AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY stored as a secret
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN}}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY:${{ github.sha }} .

      - name: Tag image for ECR
        run: |
          docker tag $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}
          docker tag $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:latest

      - name: Push image to ECR
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:latest
