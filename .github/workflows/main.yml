name: Build and Push to ECR

on:
  push:
    branches: 
    - test
env:
  AWS_REGION: us-east-1

# Required so the OIDC token can be requested from GitHub for AWS auth
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Short-lived credentials issued to this exact repo/workflow only -
      # no AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY stored as a secret
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN}}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build images with Docker Compose
        run: docker compose build

      - name: Tag backend image for ECR
        run: |
          docker tag serp-hawk-crm-v2-backend:latest \
            ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2-b:${{ github.sha }}
          docker tag serp-hawk-crm-v2-backend:latest \
            ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2-b:latest

      - name: Tag frontend image for ECR
        run: |
          docker tag serp-hawk-crm-v2-frontend:latest \
            ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2:${{ github.sha }}
          docker tag serp-hawk-crm-v2-frontend:latest \
            ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2:latest

      - name: Push backend image to ECR
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2-b:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2-b:latest

      - name: Push frontend image to ECR
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2:latest
