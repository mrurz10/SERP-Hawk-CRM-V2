name: CI/CD - Test, Quality Gate, Build & Deploy

on:
  push:
    branches: [tes1]
  pull_request:
    branches: [test1]

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: Tests + SonarQube Quality Gates
  # Runs on every push and PR. Nothing downstream happens unless this passes.
  # ---------------------------------------------------------------------
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.13'

      - name: Install backend deps
        run: pip install -r requirements.txt

      - name: Run backend tests with coverage
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml || [ $? -eq 5 ]

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/frontend/node_modules/**,**/.next/**

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ---------------------------------------------------------------------
  # Stage 2: Build & Push to ECR
  # Only runs on an actual push to `test` (not PRs), and only if Stage 1 passed.
  # ---------------------------------------------------------------------
  build-and-push:
    needs: build-test-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    outputs:
      version: v${{ github.run_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build images with Docker Compose
        run: docker compose build

      - name: Tag backend image for ECR
        run: |
          docker tag serp-hawk-crm-v2-backend:latest \
            ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2-b:v${{ github.run_number }}

      - name: Tag frontend image for ECR
        run: |
          docker tag serp-hawk-crm-v2-frontend:latest \
            ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2:v${{ github.run_number }}

      - name: Push backend image to ECR
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2-b:v${{ github.run_number }}

      - name: Push frontend image to ECR
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/serp-hawk-crm-v2:v${{ github.run_number }}

 
